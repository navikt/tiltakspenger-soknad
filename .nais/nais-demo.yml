apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tiltakspenger-soknad-demo
  namespace: tpts
  labels:
    team: tpts
spec:
  image: {{ image }}
  port: 3000
  startup:
    path: /demo/api/isAlive
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 60 # 5 + 60 × 5 s ≈ 5 min oppstartsvindu
    timeout: 3
  liveness:
    path: /demo/api/isAlive
    periodSeconds: 10
    failureThreshold: 3
    timeout: 3
  readiness:
    path: /demo/api/isReady
    periodSeconds: 5
    failureThreshold: 1
    timeout: 3
  env:
    - name: TILTAKSPENGER_SOKNAD_API_URL
      value: {{ TILTAKSPENGER_SOKNAD_API_URL }}
    - name: DEKORATOR_ENV
      value: dev
    - name: IS_DEMO_MODE
      value: "true"
    - name: NEXT_PUBLIC_BASE_PATH
      value: "/demo"
  ingresses:
    - {{ ingress }}/demo
  replicas:
    min: 1
    max: 1
  accessPolicy:
    outbound:
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
