# Tillat byggescript for spesifikke pakker selv om .npmrc har ignore-scripts=true.
# sharp:          native bildebehandling brukt av Next.js sin next/image
# unrs-resolver:  Rust-basert modulresolver brukt av eslint-plugins
allowBuilds:
  sharp: true
  unrs-resolver: true

# en uke
minimumReleaseAge: 10080

# Sikkerhetsfikser i transitive pakker: sharp kommer via next, js-cookie via nav-dekoratoren-moduler, uuid 9 via node-jose.
overrides:
  sharp: 0.35.0
  js-cookie: 3.0.8
  node-jose>uuid: 11.1.1
