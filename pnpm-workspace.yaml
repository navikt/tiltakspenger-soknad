# Tillat byggescript for spesifikke pakker selv om .npmrc har ignore-scripts=true.
# sharp:          native bildebehandling brukt av Next.js sin next/image
# unrs-resolver:  Rust-basert modulresolver brukt av eslint-plugins
# @parcel/watcher: filovervåker for jest-haste-map; nektes fordi install-scriptet bare bygger fra kildekode
#                 når ferdigbygd binær mangler, og den kommer som plattformpakke.
allowBuilds:
  '@parcel/watcher': false
  sharp: true
  unrs-resolver: true

# en uke
minimumReleaseAge: 10080
# Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
minimumReleaseAgeExclude:
  - "@navikt/*"
  - "@nais/*"

# Sikkerhetsfiks i transitiv pakke: node-jose 2.2.0 (siste versjon) krever uuid ^9.
# Fjernes når foreldrepakken selv krever fikset versjon (sjekk med `pnpm why <pakke>`).
overrides:
  node-jose>uuid: 11.1.1
